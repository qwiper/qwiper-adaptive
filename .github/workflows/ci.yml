name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.44.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 559ffa3f75e7402d65a8def9c28389a9b2e6fe42
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool example/lib example/test example/integration_test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - run: flutter test --platform chrome
      - name: Release-mode validation
        run: |
          dart compile exe tool/policy_release_smoke.dart -o "$RUNNER_TEMP/policy-smoke"
          "$RUNNER_TEMP/policy-smoke"
      - run: flutter pub get
        working-directory: example
      - run: flutter test
        working-directory: example
      - run: flutter test --platform chrome
        working-directory: example
      - run: flutter build web --release --no-web-resources-cdn
        working-directory: example
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.44.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 559ffa3f75e7402d65a8def9c28389a9b2e6fe42
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --debug
        working-directory: example
      - run: ./gradlew :qwiper_adaptive:testDebugUnitTest
        working-directory: example/android
