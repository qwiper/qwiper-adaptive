name: qwiper_adaptive_example
description: Interactive resource policy demonstration using synthetic or Android measurements.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  qwiper_adaptive:
    path: ../
  # Material's platform-adaptive controls may reference Cupertino glyphs.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
