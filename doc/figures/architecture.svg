<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc"><title id="title">Architecture et frontières de dépendance</title><desc id="desc">Les API Android ou une source injectée alimentent le détecteur. Les observations décodées entrent dans une politique pure. Le profil est consommé par l’application.</desc><rect x="5" y="12" width="280" height="116" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="18" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#252b32">Android / file de fond</text><text x="18" y="65" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">API système / collecteur</text><text x="18" y="89" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Contexte application</text><text x="18" y="113" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Champs absents omis</text><rect x="355" y="12" width="305" height="116" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="368" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#252b32">ResourceDetector</text><text x="368" y="65" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">MethodChannel / readResources</text><text x="368" y="89" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Décodage + délai</text><text x="368" y="113" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">ResourceReading + statut</text><line x1="285" y1="71" x2="350" y2="71" stroke="#4e5861" stroke-width="2"/><polygon points="350,71 341.0,67.0 341.0,75.0" fill="#4e5861"/><rect x="355" y="178" width="305" height="96" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="368" y="205" font-family="sans-serif" font-size="19" font-weight="bold" fill="#252b32">ResourcePolicy.evaluate</text><text x="368" y="231" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">DeviceResources + configuration</text><text x="368" y="255" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Dart pur : ResourceProfile</text><line x1="507" y1="128" x2="507" y2="176" stroke="#4e5861" stroke-width="2"/><polygon points="507,176 511.0,167.0 503.0,167.0" fill="#4e5861"/><rect x="735" y="178" width="260" height="96" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="748" y="205" font-family="sans-serif" font-size="19" font-weight="bold" fill="#252b32">Application hôte</text><text x="748" y="231" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Widgets, cache choisi</text><text x="748" y="255" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Services et lecteurs</text><line x1="660" y1="226" x2="730" y2="226" stroke="#4e5861" stroke-width="2"/><polygon points="730,226 721.0,222.0 721.0,230.0" fill="#4e5861"/><rect x="5" y="178" width="280" height="96" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="18" y="205" font-family="sans-serif" font-size="19" font-weight="bold" fill="#252b32">Source injectée (option)</text><text x="18" y="231" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Remplace la sonde intégrée</text><text x="18" y="255" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Mêmes champs attendus</text><line x1="285" y1="198" x2="350" y2="111" stroke="#4e5861" stroke-width="2"/><polygon points="350,111 341.4,115.8 347.8,120.6" fill="#4e5861"/></svg>
