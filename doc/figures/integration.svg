<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc"><title id="title">Consommateurs indépendants du profil</title><desc id="desc">Trois branches indépendantes partent du profil : scope puis filtre, fonction explicite sur le cache d’images, services gérés par l’application. Le scope ne configure aucun cache.</desc><rect x="5" y="139" width="246" height="97" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="18" y="166" font-family="sans-serif" font-size="19" font-weight="bold" fill="#252b32">ResourceProfile</text><text x="18" y="192" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Décision immuable</text><text x="18" y="216" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Budgets et effets</text><rect x="330" y="8" width="300" height="97" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="343" y="35" font-family="sans-serif" font-size="19" font-weight="bold" fill="#252b32">AdaptiveResourceScope</text><text x="343" y="61" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Profil pour les descendants</text><text x="343" y="85" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Aucun réglage de cache</text><rect x="710" y="8" width="285" height="97" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="723" y="35" font-family="sans-serif" font-size="19" font-weight="bold" fill="#252b32">AdaptiveBackdropFilter</text><text x="723" y="61" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Lit le profil (ou override)</text><text x="723" y="85" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Flou activé ou désactivé</text><line x1="630" y1="56" x2="705" y2="56" stroke="#4e5861" stroke-width="2"/><polygon points="705,56 696.0,52.0 696.0,60.0" fill="#4e5861"/><rect x="330" y="139" width="665" height="97" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="343" y="166" font-family="sans-serif" font-size="19" font-weight="bold" fill="#252b32">applyImageCacheBudgets(profile, cache)</text><text x="343" y="192" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Appel explicite sur l’ImageCache choisi</text><text x="343" y="216" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Limites en octets et en nombre d’entrées</text><rect x="330" y="270" width="665" height="97" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="343" y="297" font-family="sans-serif" font-size="19" font-weight="bold" fill="#252b32">Services de l’application</text><text x="343" y="323" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Lecture et application des autres budgets par le code hôte</text><text x="343" y="347" font-family="sans-serif" font-size="17" font-weight="normal" fill="#252b32">Caches disque et lecteurs non fournis par le paquet</text><line x1="251" y1="170" x2="325" y2="56" stroke="#4e5861" stroke-width="2"/><polygon points="325,56 316.7,61.4 323.5,65.7" fill="#4e5861"/><line x1="251" y1="188" x2="325" y2="188" stroke="#4e5861" stroke-width="2"/><polygon points="325,188 316.0,184.0 316.0,192.0" fill="#4e5861"/><line x1="251" y1="208" x2="325" y2="317" stroke="#4e5861" stroke-width="2"/><polygon points="325,317 323.3,307.3 316.6,311.8" fill="#4e5861"/></svg>
