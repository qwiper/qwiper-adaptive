<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">Ordre de la classification</title><desc id="desc">La première règle satisfaite détermine le profil. Des contraintes de mémoire sélectionnent low, puis le repli sans données, puis high si les indices suffisent, sinon balanced. Le stockage agit séparément.</desc><rect x="10" y="10" width="745" height="65" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="27" y="50" font-family="sans-serif" font-size="22" font-weight="bold" fill="#252b32">1</text><text x="62" y="50" font-family="sans-serif" font-size="20" font-weight="normal" fill="#252b32">Faible RAM OU RAM ≤ 3 GiB OU classe ≤ 256 MB</text><line x1="760" y1="42" x2="800" y2="42" stroke="#252b32" stroke-width="3"/><polygon points="800.0,42.0 791.0,37.0 791.0,47.0" fill="#252b32"/><rect x="805" y="10" width="185" height="65" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="826" y="50" font-family="sans-serif" font-size="22" font-weight="bold" fill="#252b32">LOW</text><line x1="32" y1="77" x2="32" y2="90" stroke="#4e5861" stroke-width="3"/><polygon points="32.0,90.0 37.0,81.0 27.1,81.0" fill="#4e5861"/><rect x="10" y="93" width="745" height="65" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="27" y="133" font-family="sans-serif" font-size="22" font-weight="bold" fill="#252b32">2</text><text x="62" y="133" font-family="sans-serif" font-size="20" font-weight="normal" fill="#252b32">RAM et classe inconnues ; CPU inconnu ou ≤ 4</text><line x1="760" y1="125" x2="800" y2="125" stroke="#252b32" stroke-width="3"/><polygon points="800.0,125.0 791.0,120.0 791.0,129.9" fill="#252b32"/><rect x="805" y="93" width="185" height="65" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="826" y="133" font-family="sans-serif" font-size="22" font-weight="bold" fill="#252b32">LOW</text><line x1="32" y1="160" x2="32" y2="173" stroke="#4e5861" stroke-width="3"/><polygon points="32.0,173.0 37.0,164.0 27.1,164.0" fill="#4e5861"/><rect x="10" y="176" width="745" height="65" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="27" y="216" font-family="sans-serif" font-size="22" font-weight="bold" fill="#252b32">3</text><text x="62" y="216" font-family="sans-serif" font-size="20" font-weight="normal" fill="#252b32">RAM ≥ 6 GiB ET CPU ≥ 6 ; classe ≥ 384 MB ou inconnue</text><line x1="760" y1="208" x2="800" y2="208" stroke="#252b32" stroke-width="3"/><polygon points="800.0,208.0 791.0,203.1 791.0,212.9" fill="#252b32"/><rect x="805" y="176" width="185" height="65" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="826" y="216" font-family="sans-serif" font-size="22" font-weight="bold" fill="#252b32">HIGH</text><line x1="32" y1="243" x2="32" y2="256" stroke="#4e5861" stroke-width="3"/><polygon points="32.0,256.0 37.0,247.0 27.1,247.0" fill="#4e5861"/><rect x="10" y="259" width="745" height="65" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="27" y="299" font-family="sans-serif" font-size="22" font-weight="bold" fill="#252b32">4</text><text x="62" y="299" font-family="sans-serif" font-size="20" font-weight="normal" fill="#252b32">Aucune condition précédente satisfaite</text><line x1="760" y1="291" x2="800" y2="291" stroke="#252b32" stroke-width="3"/><polygon points="800.0,291.0 791.0,286.1 791.0,295.9" fill="#252b32"/><rect x="805" y="259" width="185" height="65" rx="3" fill="#ffffff" stroke="#8c9299" stroke-width="1.5"/><text x="826" y="299" font-family="sans-serif" font-size="22" font-weight="bold" fill="#252b32">BALANCED</text><text x="14" y="372" font-family="sans-serif" font-size="21" font-weight="bold" fill="#252b32">Puis, indépendamment : stockage connu &lt; 1 GiB : plafonds disque réduits.</text></svg>
